name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

jobs:
  test:
    name: Build & Test
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - &install-toolchain
        name: Install Toolchain ${{ env.TOOLCHAIN }}
        run: |
          rustup toolchain update "$TOOLCHAIN" --profile minimal -c "clippy,rustfmt"
          rustup default "$TOOLCHAIN"
      - &restore-cache
        id: restore-cache
        name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-index-${{ runner.os }}--${{ env.TOOLCHAIN }}--${{ hashFiles('**/Cargo.*') }}
          restore-keys: |
            cargo-index-${{ runner.os }}--${{ env.TOOLCHAIN }}--${{ hashFiles('**/Cargo.*') }}
            cargo-index-${{ runner.os }}--${{ env.TOOLCHAIN }}--
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - name: Build
        run: |
          cargo build --verbose --workspace --all-targets
      - name: Run tests
        run: |
          cargo test --verbose --workspace --all-targets
      - name: Save cache
        # only on main
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
        

  check:
    name: Rustfmt & Clippy
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN: stable
    steps:
      - *checkout
      - *install-toolchain
      - *restore-cache
      - name: Rustfmt
        run: |
          cargo fmt --all --check
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets
